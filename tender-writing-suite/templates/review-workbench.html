<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>标书评审台</title>
<style>
/* ===== 基底（自包含，无外部依赖；视觉对照桌面版 token：brand 青/danger 红/info 蓝/warning 琥珀） ===== */
:root{
  --brand:#0F766E; --brand-soft:#0F766E14; --danger:#B91C1C; --danger-soft:#B91C1C0F;
  --info:#1D4ED8; --info-soft:#1D4ED812; --warn:#B45309; --warn-soft:#B453091A;
  --ok:#15803D; --ok-soft:#15803D12;
  --ink:#1F2937; --ink-2:#6B7280; --ink-3:#9CA3AF;
  --line:#E5E7EB; --line-soft:#F3F4F6; --canvas:#F8FAFC; --card:#FFFFFF;
  --r-lg:12px; --r-md:8px; --r-sm:4px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--canvas)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
code{font-family:var(--mono);font-size:12px;background:var(--line-soft);padding:1px 5px;border-radius:var(--r-sm)}
.num{font-variant-numeric:tabular-nums}
/* ===== 顶栏 ===== */
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.topbar h1{font-size:15px;margin:0;font-weight:600}
.topbar .proj{color:var(--ink-2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34vw}
.topbar .spacer{flex:1}
.conn{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--ok-soft);color:var(--ok)}
.conn.off{background:var(--warn-soft);color:var(--warn)}
.savestate{font-size:12px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.savestate .dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.savestate.saved .dot{background:var(--ok)}
.savestate.saving .dot{background:var(--ink-3);animation:spin 1s linear infinite}
.savestate.error{color:var(--danger)}
.savestate .retry{text-decoration:underline;color:var(--danger)}
@keyframes spin{to{transform:rotate(360deg)}}
/* ===== Tab ===== */
.tabs{display:flex;gap:4px;padding:8px 16px 0;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:49px;z-index:39}
.tabs button{padding:7px 14px;border-radius:var(--r-md) var(--r-md) 0 0;color:var(--ink-2);font-size:13px;border-bottom:2px solid transparent}
.tabs button.active{color:var(--brand);font-weight:600;border-bottom-color:var(--brand)}
.tabs button .cnt{font-size:11px;background:var(--line-soft);border-radius:999px;padding:0 6px;margin-left:4px;color:var(--ink-2)}
.panel{display:none;padding:16px;max-width:1280px;margin:0 auto}
.panel.active{display:block}
/* ===== 通用块 ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:13px;color:var(--ink);font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 .sub{color:var(--ink-3);font-weight:400;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px}
.kpi.alert{border-color:var(--danger)}
.kpi .v{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--ink-2);margin-top:2px}
.kpi .n{font-size:12px;margin-top:4px;color:var(--warn)}
.kpi.alert .n{color:var(--danger)}
.muted{color:var(--ink-2)} .small{font-size:12px} .mono{font-family:var(--mono);font-size:12px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);font-size:13px}
.btn:hover{background:var(--line-soft)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{opacity:.92;background:var(--brand)}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.ghost{border-color:transparent}
.btn.sm{padding:2px 8px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.banner{display:flex;align-items:flex-start;gap:8px;border:1px solid #FDE68A;background:var(--warn-soft);border-radius:var(--r-md);padding:10px 12px;font-size:12px;margin-bottom:12px;color:var(--ink)}
.banner.danger{border-color:#FCA5A5;background:var(--danger-soft)}
.banner.info{border-color:#93C5FD;background:var(--info-soft)}
.banner .spacer{flex:1}
/* 徽章（四色，对照桌面版） */
.badge{display:inline-block;font-size:10px;font-weight:500;padding:0 6px;line-height:18px;border-radius:var(--r-sm);cursor:pointer;white-space:nowrap}
.badge.MAND{color:var(--danger);background:var(--danger-soft)}
.badge.TPL{color:var(--info);background:var(--info-soft)}
.badge.REQ{color:var(--brand);background:var(--brand-soft)}
.badge.SCORE{color:var(--warn);background:var(--warn-soft)}
.chip{display:inline-block;font-size:11px;padding:0 8px;line-height:20px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.chip.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.chip.brand{color:var(--brand);border-color:var(--brand);background:var(--brand-soft)}
/* ===== 总览 ===== */
.parse-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.parse-file{border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px}
.parse-file .fn{font-weight:600;font-size:13px;word-break:break-all}
.parse-file .warn{color:var(--warn);font-size:12px;margin-top:4px}
.clar-item{border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin-bottom:10px}
.clar-item .q{font-weight:600;font-size:13px}
.clar-item .meta{font-size:12px;color:var(--ink-2);margin:4px 0 8px}
.clar-item .act{background:var(--line-soft);border-radius:var(--r-sm);padding:6px 10px;font-size:12px;margin-bottom:8px}
.clar-item.verdicted{opacity:.75}
.opts{display:flex;flex-direction:column;gap:6px}
.opts label{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:var(--r-md);font-size:13px;cursor:pointer}
.opts label:hover{background:var(--line-soft)}
.opts input{accent-color:var(--brand)}
.gate-row{display:flex;flex-wrap:wrap;gap:8px}
.gate{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-md);padding:6px 10px;font-size:12px}
.gate .st{font-size:11px;padding:0 8px;border-radius:999px;line-height:18px;background:var(--line-soft);color:var(--ink-3)}
.gate.pass .st{background:var(--ok-soft);color:var(--ok)}
/* ===== 目录树 ===== */
.tree-tools{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tree-tools input[type=search]{flex:0 1 220px;padding:5px 10px;border:1px solid var(--line);border-radius:var(--r-md)}
.matchcnt{font-size:12px;color:var(--ink-2)}
.vol{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:14px}
.vol-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.vol-head .vn{font-weight:600;font-size:14px}
.vol-head .vc{font-size:12px;color:var(--ink-2)}
.vol-head .info-btn{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);color:var(--ink-2);font-size:11px;line-height:1;text-align:center}
.legend{padding:8px 14px;background:var(--line-soft);font-size:12px;color:var(--ink-2);display:flex;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.scope{padding:8px 14px;font-size:12px;color:var(--ink-2)}
.rows{padding:6px 8px 10px}
.row{position:relative;border-radius:var(--r-md)}
.row .line{display:flex;align-items:center;gap:4px;min-height:30px;padding:2px 6px;border-radius:var(--r-md)}
.row .line:hover{background:var(--line-soft)}
.row.drop-above>.line{box-shadow:inset 0 2px 0 var(--brand)}
.row.drop-below>.line{box-shadow:inset 0 -2px 0 var(--brand)}
.row.drop-inside>.line{outline:2px solid var(--brand);background:var(--brand-soft)}
.row.dragging{opacity:.4}
.row .tw{width:18px;flex:none;color:var(--ink-3);cursor:pointer;font-size:10px;text-align:center}
.row .tw.nofill{visibility:hidden}
.row .grip{cursor:grab;color:var(--ink-3);font-size:12px;padding:0 2px;user-select:none}
.row .nm{cursor:default}
.row .nm input{width:280px;padding:2px 6px;border:1px solid var(--brand);border-radius:var(--r-sm)}
.row .npre{font-size:11px;color:var(--ink-3);font-family:var(--mono);min-width:52px}
.row .ovl{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px;margin-left:8px}
.rowbtns{display:none;margin-left:auto;gap:2px}
.row .line:hover .rowbtns{display:flex}
.rowbtns button{width:24px;height:24px;border-radius:var(--r-sm);color:var(--ink-2);font-size:12px;line-height:1}
.rowbtns button:hover{background:var(--line);color:var(--ink)}
.rowbtns button.rb-del.arm{background:var(--danger);color:#fff}
.kids{margin-left:18px;border-left:1px dashed var(--line);padding-left:6px}
.ctxmenu{position:fixed;z-index:100;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:0 8px 24px #0002;min-width:160px;padding:4px}
.ctxmenu button{display:block;width:100%;text-align:left;padding:6px 12px;border-radius:var(--r-sm);font-size:13px}
.ctxmenu button:hover{background:var(--line-soft)}
.ctxmenu button:disabled{opacity:.35}
.ctxmenu button.danger{color:var(--danger)}
.ctxmenu button.danger:hover{background:var(--danger-soft)}
.structbar{border:1px solid #FDE68A;background:var(--warn-soft);border-radius:var(--r-md);padding:10px 12px;font-size:12px;margin-bottom:12px}
.structbar.pulse{animation:pulse .45s ease 3}
@keyframes pulse{50%{outline:2px solid var(--warn)}}
/* ===== 溯源弹窗 ===== */
.mask{position:fixed;inset:0;background:#0008;z-index:90;display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px}
.modal{background:var(--card);border-radius:var(--r-lg);max-width:640px;width:100%;max-height:76vh;overflow:auto;padding:16px 18px}
.modal h4{margin:0 0 4px;font-size:14px}
.modal .close{position:sticky;float:right;top:0;font-size:16px;color:var(--ink-3)}
.modal .srctext{border-left:3px solid var(--line);background:var(--line-soft);padding:8px 12px;border-radius:var(--r-sm);font-size:13px;margin:10px 0;white-space:pre-wrap}
.ctxblk{border:1px solid var(--line);border-radius:var(--r-md);margin-top:10px;max-height:280px;overflow:auto;font-family:var(--mono);font-size:12px}
.ctxblk .cl{display:flex;gap:10px;padding:1px 10px;white-space:pre-wrap}
.ctxblk .cl .no{color:var(--ink-3);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.ctxblk .cl.hit{background:var(--brand-soft);color:var(--brand);font-weight:600}
/* ===== 写作指引 ===== */
.gwrap{display:flex;gap:14px;align-items:flex-start}
.gtree{flex:0 0 34%;min-width:240px;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px}
.gtree .search{width:100%;padding:5px 10px;border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:8px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.pills button{font-size:11px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2)}
.pills button.active{background:var(--brand);border-color:var(--brand);color:#fff}
.pills button.warnpill{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.pills button.okpill{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.pills button:disabled{opacity:.35}
.gnode{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:var(--r-sm);cursor:pointer;font-size:13px}
.gnode:hover{background:var(--line-soft)}
.gnode.sel{background:var(--brand-soft);color:var(--brand);font-weight:600}
.gnode .dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.pending{background:var(--ink-3)}
.dot.unassigned{background:transparent;border:1.5px dashed var(--ink-3)}
.dot.ok{background:var(--ok)}
.dot.warn{background:var(--warn)}
.gdetail{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px}
.gdetail h3{margin:0 0 2px;font-size:15px}
.block{margin-top:14px}
.block .bt{font-size:12px;color:var(--ink-2);font-weight:600;margin-bottom:6px}
.kvrow{font-size:13px;margin:2px 0}
.kvrow .k{color:var(--ink-2);display:inline-block;min-width:76px}
.modechips{display:flex;flex-wrap:wrap;gap:8px}
.modechips button{font-size:12px;padding:3px 12px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2)}
.modechips button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.modechips button.excl.on{background:var(--warn);border-color:var(--warn)}
.gdetail input[type=text],.gdetail textarea{width:100%;padding:5px 10px;border:1px solid var(--line);border-radius:var(--r-md);font-size:13px}
.gdetail input.bad{border-color:var(--danger);background:var(--danger-soft)}
.gdetail textarea{min-height:60px;resize:vertical}
.ferr{color:var(--danger);font-size:12px;margin-top:3px}
.basisrow{border:1px solid var(--line);border-radius:var(--r-md);padding:8px 10px;margin-top:6px;font-size:12px}
.basisrow .bid{margin-right:6px}
.basisrow .quote{color:var(--ink);margin-top:2px}
.basisrow .src{color:var(--ink-3);margin-top:2px}
.stance{display:inline-block;font-size:11px;padding:0 8px;line-height:20px;border-radius:var(--r-sm);background:var(--warn-soft);color:var(--warn);font-weight:600;margin-right:8px}
.notegroups .ng{margin-top:8px}
.notegroups .ng .nt{font-size:12px;font-weight:600;margin-bottom:3px}
.notegroups .warn .nt{color:var(--warn)}
.notegroups .info .nt{color:var(--info)}
/* ===== 承诺 ===== */
.principle{border:1px solid #FDE68A;background:var(--warn-soft);border-radius:var(--r-md);padding:10px 14px;font-size:13px;margin-bottom:14px}
.promise{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:12px}
.promise.pending{border-color:var(--warn);background:#FFFBEB}
.promise .head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.promise .item{font-weight:600;font-size:14px}
.promise .st{font-size:11px;padding:0 8px;border-radius:999px;line-height:18px}
.promise.filled .st{background:var(--ok-soft);color:var(--ok)}
.promise.pending .st{background:var(--warn-soft);color:var(--warn)}
.promise .body{display:flex;gap:14px;flex-wrap:wrap}
.promise .col{flex:1 1 260px;min-width:240px}
.promise .col .ct{font-size:12px;color:var(--ink-2);font-weight:600;margin-bottom:4px}
.promise input[type=text]{width:100%;padding:6px 10px;border:1px solid var(--line);border-radius:var(--r-md)}
.promise input.bad{border-color:var(--danger)}
.promise .note{font-size:12px;color:var(--ink-2);margin-top:4px}
/* ===== toast / 弹层 ===== */
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:#fff;border-radius:var(--r-md);padding:8px 16px;font-size:13px;max-width:70vw}
.toast.err{background:var(--danger)}
.report li{margin:3px 0;font-size:13px}
.report .sec{font-weight:600;margin-top:10px;font-size:13px}
</style>
</head>
<body>

<header class="topbar">
  <h1>标书评审台</h1>
  <span class="proj" id="proj"></span>
  <span class="spacer"></span>
  <span class="savestate" id="savestate" hidden><span class="dot"></span><span id="savesxt"></span></span>
  <span class="conn" id="conn">检测连接…</span>
</header>

<nav class="tabs" id="tabs" role="tablist">
  <button data-tab="overview" class="active">总览</button>
  <button data-tab="tree">目录树<span class="cnt" id="cnt-tree"></span></button>
  <button data-tab="guide">写作指引<span class="cnt" id="cnt-guide"></span></button>
  <button data-tab="promise">承诺清单<span class="cnt" id="cnt-promise"></span></button>
</nav>

<!-- 总览 -->
<section class="panel active" id="panel-overview">
  <div id="ov-banner"></div>
  <div class="kpis" id="kpis"></div>
  <div class="card"><h3>确认门进度 <span class="sub">连续模式下由助手越门汇报，你可在此补确认</span></h3><div class="gate-row" id="gates"></div></div>
  <div class="card"><h3>解析概况 <span class="sub" id="parse-sub"></span></h3><div class="parse-grid" id="parse"></div></div>
  <div class="card"><h3>评分项与覆盖 <span class="sub" id="score-sub"></span></h3><div id="scores"></div></div>
  <div class="card"><h3>废标条款 <span class="sub" id="disq-sub"></span></h3><div id="disq"></div></div>
  <div class="card"><h3>待澄清问卷 <span class="sub">逐条裁决，裁决即记录进澄清清单与确认台账</span></h3><div id="clar"></div></div>
</section>

<!-- 目录树 -->
<section class="panel" id="panel-tree">
  <div id="tree-banner"></div>
  <div class="tree-tools">
    <button class="btn primary" id="tree-edit-btn">编辑目录</button>
    <button class="btn" id="tree-done-btn" hidden>完成编辑</button>
    <span class="savestate" id="tree-savestate" hidden><span class="dot"></span><span></span></span>
    <span id="tree-hint" class="small muted" hidden>拖拽移动（上/下插入、中间并入） · 右键更多操作</span>
    <span class="spacer" style="flex:1"></span>
    <span class="matchcnt" id="tree-match" hidden></span>
    <input type="search" id="tree-search" placeholder="搜索目录…">
    <select id="num-sel" title="编号在生成整本 Word 时套用；此处目录树实时预览编号效果">
      <option value="chapter">第一章 + 1.1</option>
      <option value="decimal">1 + 1.1</option>
      <option value="gov">一、（一）1.</option>
      <option value="none">不编号</option>
    </select>
  </div>
  <div id="structbar-slot"></div>
  <div id="volumes"></div>
</section>

<!-- 写作指引 -->
<section class="panel" id="panel-guide">
  <div id="guide-banner"></div>
  <div class="tree-tools">
    <button class="btn primary" id="guide-edit-btn">编辑指引</button>
    <button class="btn primary" id="guide-done-btn" hidden>完成编辑</button>
    <span class="savestate" id="guide-savestate" hidden><span class="dot"></span><span></span></span>
    <span class="spacer" style="flex:1"></span>
    <button class="btn" id="guide-export-btn" hidden>导出修改包</button>
  </div>
  <div class="gwrap">
    <div class="gtree">
      <input type="search" class="search" id="guide-search" placeholder="搜索章节">
      <div class="pills" id="guide-pills"></div>
      <div id="guide-tree"></div>
      <div id="guide-offtree"></div>
    </div>
    <div class="gdetail" id="guide-detail"></div>
  </div>
</section>

<!-- 承诺清单 -->
<section class="panel" id="panel-promise">
  <div class="principle">⚖️ 承诺有法律后果——AI 不生成承诺，只做三件事：找到约束、给出建议、说清依据。拍板权永远在你。</div>
  <div class="tree-tools">
    <button class="btn primary" id="promise-edit-btn">填写 / 调整</button>
    <button class="btn primary" id="promise-done-btn" hidden>完成</button>
    <span class="savestate" id="promise-savestate" hidden><span class="dot"></span><span></span></span>
    <span class="spacer" style="flex:1"></span>
    <button class="btn" id="promise-export-btn" hidden>导出修改包</button>
  </div>
  <div id="promises"></div>
</section>

<div class="toasts" id="toasts"></div>
<div id="modal-slot"></div>

<script type="application/json" id="review-data">__REVIEW_DATA__</script>
<script>
"use strict";
/* ================= 数据与状态 ================= */
const DATA = JSON.parse(document.getElementById("review-data").textContent);
const API = "__REVIEW_API__";               // "" = 离线（file://）；"/<token>/" = 服务模式
const ONLINE = API !== "";
const $ = s => document.querySelector(s);
const MAX_LEVEL = 5, HISTORY_LIMIT = 50;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cp = o => JSON.parse(JSON.stringify(o));
const uidc = (() => { let i = 0; return () => "x" + (++i); })();

const S = {
  tab: "overview", vol: {}, expanded: new Set(), undo: [], redo: [],
  log: {},                                     // vol -> [ops]
  treeEdit: false, numScheme: "chapter", treeSearch: "", structConfirmed: false,
  savedLogLen: {}, guideSel: null, guideEdit: false, guideFilter: "all", guideSearch: "",
  guideDirty: {}, guideRemoved: {},            // key -> {field:val} / key -> true
  promiseEdit: false, promiseDirty: {},
  savedGuide: false, savedPromise: false,
  online: ONLINE,
};
for (const v of DATA.volumes) {
  S.vol[v.name] = { nodes: reuid(v.nodes) };
  S.log[v.name] = [];
  S.savedLogLen[v.name] = 0;
  (function open1(list) { for (const n of list) { if (n.depth !== undefined ? n.depth <= 1 : true) { S.expanded.add(n.uid); open1(n.children); } } })(S.vol[v.name].nodes);
}
function reuid(list, p = "") {
  return list.map((n, i) => ({ uid: p ? p + "/" + i : String(i), text: n.text,
    src: n.src || [], desc: n.desc || null, children: reuid(n.children || [], (p ? p + "/" : "") + i) }));
}

/* ================= 基础 UI ================= */
function toast(msg, err) {
  const t = document.createElement("div");
  t.className = "toast" + (err ? " err" : ""); t.textContent = msg;
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), err ? 5200 : 3200);
}
function setSaveState(el, st, extra) {
  if (!st) { el.hidden = true; return; }
  el.hidden = false;
  el.className = "savestate " + (st === "saved" ? "saved" : st === "saving" ? "saving" : st === "error" ? "error" : "");
  const t = el.querySelector("span:last-child");
  if (st === "saving") t.textContent = "保存中…";
  else if (st === "dirty") t.textContent = "未保存";
  else if (st === "saved") t.textContent = "已保存 · " + (extra || "刚刚");
  else if (st === "error") { t.textContent = "保存失败 · "; const b = document.createElement("button"); b.className = "retry"; b.textContent = "点击重试"; b.onclick = () => saveAll(); t.appendChild(b); }
  else if (st === "conflict") t.textContent = "有新版本 · 请在上方提示中选择";
}
function dirtyState() {
  const tDirty = Object.keys(S.vol).some(v => S.log[v].length > S.savedLogLen[v]);
  const gDirty = Object.keys(S.guideDirty).length > 0 || Object.keys(S.guideRemoved).length > 0;
  const pDirty = Object.keys(S.promiseDirty).length > 0;
  return { tDirty, gDirty, pDirty, any: tDirty || gDirty || pDirty };
}
function refreshSaveStates() {
  const d = dirtyState();
  const els = [["#savestate", d.any], ["#tree-savestate", d.tDirty], ["#guide-savestate", d.gDirty], ["#promise-savestate", d.pDirty]];
  for (const [sel, dirty] of els) { const el = $(sel); if (el) setSaveState(el, dirty ? "dirty" : (S.lastSaved ? "saved" : ""), dirty ? "" : S.lastSaved); }
  if (!d.any && S.lastSaved) { const el = $("#savestate"); setSaveState(el, "saved", S.lastSaved); }
}
function tabCount() {
  let leaves = 0, rows = DATA.guide.rows.length;
  for (const v of DATA.volumes) (function w(ns) { for (const n of ns) { if (!n.children.length) leaves++; w(n.children); } })(S.vol[v.name].nodes);
  $("#cnt-tree").textContent = leaves;
  $("#cnt-guide").textContent = rows;
  $("#cnt-promise").textContent = DATA.promise.rows.length;
}
function switchTab(name) {
  S.tab = name;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === "panel-" + name));
  history.replaceState(null, "", "#tab=" + name);
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => switchTab(b.dataset.tab));

/* ================= 编号预览 ================= */
const CN = "一二三四五六七八九十";
function cnNum(n) { if (n <= 10) return CN[n - 1] || String(n); if (n < 20) return "十" + (n % 10 ? CN[n % 10 - 1] : ""); return CN[Math.floor(n / 10) - 1] + "十" + (n % 10 ? CN[n % 10 - 1] : ""); }
function numberingMap(volName) {
  const map = {}; const counters = [0, 0, 0, 0, 0]; let inFront = true;
  (function walk(list, depth) {
    let sib = 0;
    for (const n of list) {
      sib++;
      if (inFront && n.text === "目录") { inFront = false; map[n.uid] = ""; walk(n.children, depth + 1); continue; }
      if (inFront) { map[n.uid] = ""; walk(n.children, depth + 1); continue; }
      for (let i = depth; i < 5; i++) counters[i] = 0;
      counters[depth - 1] = sib;
      if (S.numScheme === "none") map[n.uid] = "";
      else if (S.numScheme === "chapter") map[n.uid] = depth === 1 ? "第" + cnNum(counters[0]) + "章" : counters.slice(0, depth).join(".");
      else if (S.numScheme === "decimal") map[n.uid] = counters.slice(0, depth).join(".");
      else map[n.uid] = depth === 1 ? cnNum(counters[0]) + "、" : depth === 2 ? "（" + cnNum(counters[1]) + "）" : counters.slice(0, depth).join(".");
      walk(n.children, depth + 1);
    }
  })(S.vol[volName].nodes, 1);
  return map;
}

function refreshNumbering() {
  for (const v of DATA.volumes) {
    const m = numberingMap(v.name);
    document.querySelectorAll(`[data-vol="${CSS.escape(v.name)}"] .npre`).forEach(el => {
      el.textContent = m[el.dataset.uid] || ""; el.style.visibility = m[el.dataset.uid] ? "visible" : "hidden";
    });
  }
}
$("#num-sel").onchange = e => { S.numScheme = e.target.value; refreshNumbering(); };

/* ================= 树：查找 / 动作 / 日志 ================= */
/* 身份与寻址分离：uid 只作身份（服务端节点=构建路径串，新节点=x 序号），
   路径/父级/兄弟一律经 locate() 走树取得。 */
function locate(uid, volName) {
  for (const vn of Object.keys(S.vol)) {
    if (volName && vn !== volName) continue;
    const found = (function w(list, path) {
      for (let i = 0; i < list.length; i++) {
        if (list[i].uid === uid) return { node: list[i], path: [...path, i], parent: null, parentPath: [], index: i };
        const sub = w(list[i].children, [...path, i]);
        if (sub) {
          if (sub.parent === null) { sub.parent = list[i]; sub.parentPath = [...path, i]; }
          return sub;
        }
      }
      return null;
    })(S.vol[vn].nodes, []);
    if (found) return { vol: vn, ...found };
  }
  return null;
}
function findNode(uid, volName) { const l = locate(uid, volName); return l ? { vol: l.vol, node: l.node, path: l.path } : null; }
function isAncestor(ancUid, uid) {
  const a = locate(ancUid); if (!a) return false;
  return (function w(ns) { for (const n of ns) { if (n.uid === uid) return true; if (w(n.children)) return true; } return false; })(a.node.children);
}
function sibsOf(loc) { return loc.parent ? loc.parent.children : S.vol[loc.vol].nodes; }
function snap() {
  S.undo.push({ tree: cp(Object.fromEntries(Object.entries(S.vol).map(([k, v]) => [k, v.nodes]))), log: cp(S.log) });
  if (S.undo.length > HISTORY_LIMIT) S.undo.shift();
  S.redo = [];
}
function stateNow() { return { tree: Object.fromEntries(Object.entries(S.vol).map(([k, v]) => [k, v.nodes])), log: S.log }; }
function doUndo() {
  const s = S.undo.pop(); if (!s) return;
  S.redo.push(stateNow());
  for (const k of Object.keys(S.vol)) { S.vol[k].nodes = s.tree[k]; S.log[k] = s.log[k]; }
  renderVolumes(); refreshNumbering(); toast("已撤销");
}
function doRedo() {
  const s = S.redo.pop(); if (!s) return;
  S.undo.push(stateNow());
  for (const k of Object.keys(S.vol)) { S.vol[k].nodes = s.tree[k]; S.log[k] = s.log[k]; }
  renderVolumes(); refreshNumbering();
}
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z" && S.treeEdit) {
    e.preventDefault(); if (e.shiftKey) doRedo(); else doUndo();
  }
});
function pushLog(volName, op) { S.log[volName].push(op); renderVolumes(); refreshNumbering(); refreshSaveStates(); draftSoon(); }
function actRename(uid, text) { const f = findNode(uid); if (!f || !text.trim()) return; snap(); f.node.text = text.trim(); pushLog(f.vol, { op: "rename", path: f.path, text: text.trim() }); }
function actAdd(parentUid, index, volName) {
  let sibs, parentPath = [], vol, childDepth = 1;
  if (parentUid) {
    const p = locate(parentUid); if (!p) return;
    childDepth = p.path.length + 1;
    if (childDepth > MAX_LEVEL) return toast("层级封顶 5 级，不能再加子级", 1);
    sibs = p.node.children; parentPath = p.path; vol = p.vol;
  } else { vol = volName || DATA.volumes[0].name; sibs = S.vol[vol].nodes; }
  const idx = Math.max(0, Math.min(index ?? sibs.length, sibs.length));
  snap();
  sibs.splice(idx, 0, { uid: uidc(), text: "新章节", src: [], desc: null, children: [] });
  pushLog(vol, { op: "add", parent: parentPath, index: idx, text: "新章节" });
  if (parentUid) S.expanded.add(parentUid);
}
function actRemove(uid) {
  const loc = locate(uid); if (!loc) return;
  snap();
  sibsOf(loc).splice(loc.index, 1);
  pushLog(loc.vol, { op: "remove", path: loc.path });
}
function actMove(uid, toParentUid, index) {
  const loc = locate(uid); if (!loc) return;
  const tp = toParentUid ? locate(toParentUid) : null;
  if (toParentUid && (toParentUid === uid || isAncestor(uid, toParentUid))) return toast("不能移动到自身或其子孙节点内", 1);
  if (tp && tp.path.length + 1 > MAX_LEVEL) return toast("层级封顶 5 级，不能移入该位置", 1);
  snap();
  sibsOf(loc).splice(loc.index, 1);
  const newSibs = tp ? tp.node.children : S.vol[loc.vol].nodes;
  const idx = Math.max(0, Math.min(index ?? 0, newSibs.length));
  newSibs.splice(idx, 0, loc.node);
  pushLog(loc.vol, { op: "move", path: loc.path, to_parent: tp ? tp.path : [], index: idx });
}
function actUpDown(uid, dir) {
  const loc = locate(uid); if (!loc) return;
  const sibs = sibsOf(loc), i = loc.index, j = i + dir;
  if (j < 0 || j >= sibs.length) return;
  snap();
  [sibs[i], sibs[j]] = [sibs[j], sibs[i]];
  pushLog(loc.vol, { op: "move", path: loc.path, to_parent: loc.parentPath, index: j });
}
function actPromote(uid) {
  const loc = locate(uid); if (!loc) return;
  if (!loc.parent) return toast("根级章节不能再升级", 1);
  snap();
  sibsOf(loc).splice(loc.index, 1);
  const gp = locate(loc.parent.uid);
  const gpSibs = gp.parent ? gp.parent.children : S.vol[gp.vol].nodes;
  gpSibs.splice(gp.index + 1, 0, loc.node);
  const nl = locate(loc.node.uid);
  pushLog(loc.vol, { op: "move", path: loc.path, to_parent: nl.path.slice(0, -1), index: nl.index });
}
function actDemote(uid) {
  const loc = locate(uid); if (!loc) return;
  if (loc.index === 0) return toast("同层第一个节点没有前一个同级可并入", 1);
  if (loc.path.length + 1 > MAX_LEVEL) return toast("层级封顶 5 级，不能再降级", 1);
  const prev = sibsOf(loc)[loc.index - 1];
  snap();
  sibsOf(loc).splice(loc.index, 1);
  prev.children.push(loc.node);
  const nl = locate(loc.node.uid);
  pushLog(loc.vol, { op: "move", path: loc.path, to_parent: nl.path.slice(0, -1), index: nl.index });
}

/* ================= 树渲染 ================= */
function structCount() {
  let n = 0;
  for (const v of Object.keys(S.log)) for (const op of S.log[v].slice(S.savedLogLen[v])) if (op.op !== "rename") n++;
  return n;
}
function renderStructBar() {
  const slot = $("#structbar-slot"); slot.innerHTML = "";
  if (!S.treeEdit || S.structConfirmed || structCount() === 0) return;
  const bar = document.createElement("div");
  bar.className = "structbar"; bar.id = "struct-confirm";
  bar.innerHTML = `检测到结构性修改（新增/删除/移动节点 ${structCount()} 处）——保存后，后续 AI 将以新目录为准继续工作（生成正文等）。纯改名不会触发本提示。`;
  const b1 = document.createElement("button"); b1.className = "btn sm"; b1.style.marginRight = "8px"; b1.textContent = "返回修改";
  b1.onclick = () => { bar.remove(); };
  const b2 = document.createElement("button"); b2.className = "btn sm warn"; b2.textContent = "继续保存";
  b2.onclick = () => { S.structConfirmed = true; renderStructBar(); saveAll(); };
  bar.appendChild(document.createElement("br")); bar.appendChild(b1); bar.appendChild(b2);
  slot.appendChild(bar);
}
function nodeBadges(n) {
  const ids = [...new Set([...(n.src || []), ...((n.desc && n.desc.理由来源 ? n.desc.理由来源 : "").split(/[,，、]/).filter(Boolean))])];
  return ids.filter(id => /^(MAND|TPL|REQ|SCORE)-\d+$/i.test(id));
}
function renderVolumes() {
  const host = $("#volumes"); host.innerHTML = "";
  const q = S.treeSearch.trim().toLowerCase();
  let matchTotal = 0;
  for (const v of DATA.volumes) {
    const volEl = document.createElement("div"); volEl.className = "vol";
    volEl.dataset.vol = v.name;
    const numMap = numberingMap(v.name);
    const head = document.createElement("div"); head.className = "vol-head";
    head.innerHTML = `<span class="vn">${esc(v.name)}</span><span class="vc num">${S.vol[v.name].nodes.length} 个顶层章节</span>`;
    const ib = document.createElement("button"); ib.className = "info-btn"; ib.textContent = "i"; ib.title = "来源标注图例";
    ib.onclick = () => legendEl.hidden = !legendEl.hidden;
    head.appendChild(ib); volEl.appendChild(head);
    const legendEl = document.createElement("div"); legendEl.className = "legend"; legendEl.hidden = true;
    legendEl.innerHTML = `来源标注（点徽章看原文与出处）：<span class="badge MAND">MAND 资格/强制条款</span><span class="badge TPL">TPL 格式件（招标方给定）</span><span class="badge REQ">REQ 商务技术要求</span><span class="badge SCORE">SCORE 评分项</span>`;
    volEl.appendChild(legendEl);
    if (v.scope) { const sc = document.createElement("div"); sc.className = "scope"; sc.textContent = "编制说明：" + v.scope; volEl.appendChild(sc); }
    const rows = document.createElement("div"); rows.className = "rows";
    matchTotal += renderRows(rows, S.vol[v.name].nodes, v.name, numMap, q, 0);
    volEl.appendChild(rows); host.appendChild(volEl);
  }
  $("#tree-match").hidden = !q;
  if (q) $("#tree-match").textContent = matchTotal + " 个匹配";
}
function rowMatches(n, q) {
  if (!q) return true;
  const self = n.text.toLowerCase().includes(q) || ((n.desc && n.desc.概述) || "").toLowerCase().includes(q);
  return self || n.children.some(c => rowMatches(c, q));
}
function renderRows(host, list, volName, numMap, q, depth, parentUid) {
  let count = 0;
  for (let i = 0; i < list.length; i++) {
    const n = list[i];
    if (q && !rowMatches(n, q)) continue;
    count++;
    host.appendChild(renderRow(n, volName, numMap, depth, i, parentUid));
    if (n.children.length && (S.expanded.has(n.uid) || q)) {
      const kids = document.createElement("div"); kids.className = "kids";
      count += renderRows(kids, n.children, volName, numMap, q, depth + 1, n.uid);
      host.appendChild(kids);
    }
  }
  return count;
}
function renderRow(n, volName, numMap, depth, idx, parentUid) {
  const row = document.createElement("div"); row.className = "row"; row.dataset.uid = n.uid;
  const line = document.createElement("div"); line.className = "line"; line.style.marginLeft = (depth * 0) + "px";
  const tw = document.createElement("span"); tw.className = "tw" + (n.children.length ? "" : " nofill");
  tw.textContent = n.children.length ? (S.expanded.has(n.uid) ? "▼" : "▶") : "";
  tw.onclick = () => { S.expanded.has(n.uid) ? S.expanded.delete(n.uid) : S.expanded.add(n.uid); renderVolumes(); refreshNumbering(); };
  line.appendChild(tw);
  if (S.treeEdit) {
    const grip = document.createElement("span"); grip.className = "grip"; grip.title = "拖拽移动：节点上/下边缘=插到同级前后，中间=并入其子节点"; grip.textContent = "⋮⋮"; grip.draggable = true;
    grip.ondragstart = e => { e.dataTransfer.setData("text/uid", n.uid); S.dragUid = n.uid; row.classList.add("dragging"); };
    grip.ondragend = () => { row.classList.remove("dragging"); S.dragUid = null; };
    line.appendChild(grip);
  }
  const pre = document.createElement("span"); pre.className = "npre"; pre.dataset.uid = n.uid; pre.textContent = numMap[n.uid] || "";
  if (!numMap[n.uid]) pre.style.visibility = "hidden";
  line.appendChild(pre);
  const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = n.text;
  nm.title = [n.desc && n.desc.概述, n.desc && n.desc.归位理由].filter(Boolean).join("｜");
  nm.ondblclick = () => { if (!S.treeEdit) return; inlineRename(nm, n.text, t => actRename(n.uid, t)); };
  line.appendChild(nm);
  for (const id of nodeBadges(n)) {
    const b = document.createElement("span");
    const t = id.split("-")[0].toUpperCase();
    b.className = "badge " + t; b.textContent = id;
    b.title = id + " " + ({ MAND: "资格/强制条款", TPL: "格式件（招标方给定）", REQ: "商务技术要求", SCORE: "评分项" }[t] || "") + " · 点击看原文与出处";
    b.onclick = () => openTrace(id);
    line.appendChild(b);
  }
  if (n.desc && n.desc["交付形态"]) { const c = document.createElement("span"); c.className = "chip"; c.textContent = n.desc["交付形态"]; line.appendChild(c); }
  if (S.treeEdit) {
    const ovl = document.createElement("span"); ovl.className = "ovl"; ovl.textContent = (n.desc && n.desc.概述) || ""; line.appendChild(ovl);
    const btns = document.createElement("span"); btns.className = "rowbtns";
    const mk = (txt, title, fn, cls) => { const b = document.createElement("button"); b.textContent = txt; b.title = title; if (cls) b.className = cls; b.onclick = e => { e.stopPropagation(); fn(); }; return b; };
    btns.appendChild(mk("↑", "上移", () => actUpDown(n.uid, -1)));
    btns.appendChild(mk("↓", "下移", () => actUpDown(n.uid, 1)));
    btns.appendChild(mk("✎", "改名（也可双击名称）", () => inlineRename(nm, n.text, t => actRename(n.uid, t))));
    btns.appendChild(mk("＋", "新增同级", () => actAdd(parentUid, idx + 1, volName)));
    const add = mk("↳", depth + 1 > MAX_LEVEL ? "层级封顶 5 级" : "新增子级", () => actAdd(n.uid, 0));
    if (depth + 1 > MAX_LEVEL) add.disabled = true;
    btns.appendChild(add);
    const del = mk("🗑", "删除（含子节点）", () => {
      if (del.classList.contains("arm")) actRemove(n.uid);
      else { del.classList.add("arm"); del.title = "再点一次确认删除（含子节点）"; setTimeout(() => { del.classList.remove("arm"); del.title = "删除（含子节点）"; }, 2500); }
    });
    btns.appendChild(del);
    ["封面", "目录"].includes(n.text) && (del.title = "删除（含子节点）——合册按名识别「" + n.text + "」", btns.title = "「封面」「目录」由合册按名识别，改名/删除会影响封面页与目录页生成");
    line.appendChild(btns);
  }
  row.appendChild(line);
  row.ondragover = e => {
    if (!S.treeEdit) return;
    e.preventDefault();
    const srcUid = S.dragUid || e.dataTransfer.getData("text/uid"); if (!srcUid || srcUid === n.uid || isAncestor(srcUid, n.uid)) return;
    const r = row.getBoundingClientRect(); const y = (e.clientY - r.top) / r.height;
    row.classList.remove("drop-above", "drop-below", "drop-inside");
    row.classList.add(y < .25 ? "drop-above" : y > .75 ? "drop-below" : "drop-inside");
  };
  row.ondragleave = () => row.classList.remove("drop-above", "drop-below", "drop-inside");
  row.ondrop = e => {
    e.preventDefault();
    const cls = ["drop-above", "drop-below", "drop-inside"].find(c => row.classList.contains(c));
    row.classList.remove(...cls ? [cls] : []);
    const srcUid = S.dragUid || e.dataTransfer.getData("text/uid"); if (!srcUid) return;
    const r = row.getBoundingClientRect(); const y = (e.clientY - r.top) / r.height;
    if (y < .25) actMove(srcUid, parentUid, idx);
    else if (y > .75) actMove(srcUid, parentUid, idx + 1);
    else { if (depth + 1 > MAX_LEVEL) return toast("层级封顶 5 级", 1); actMove(srcUid, n.uid, n.children.length); }
  };
  row.oncontextmenu = e => { if (S.treeEdit) { e.preventDefault(); openCtx(e.clientX, e.clientY, n, volName); } };
  return row;
}
function inlineRename(nm, old, cb) {
  const input = document.createElement("input"); input.value = old;
  nm.textContent = ""; nm.appendChild(input); input.focus(); input.select();
  let done = false;

      S.log[v] = ops.slice();
    }
    S.guideDirty = dr.guideDirty || {}; S.guideRemoved = dr.guideRemoved || {}; S.promiseDirty = dr.promiseDirty || {};
    b.remove(); renderVolumes(); refreshNumbering(); renderGuideTree(); renderGuidePills(); renderPromises(); refreshSaveStates();
    toast("草稿已恢复（未保存，继续编辑后点保存）");
  };
  const b2 = document.createElement("button"); b2.className = "btn sm"; b2.textContent = "丢弃";
  b2.onclick = () => { b.remove(); draftClear(); };
  b.appendChild(b1); b.appendChild(b2); host.appendChild(b);
}
function replayOp(volName, op) {
  const roots = S.vol[volName].nodes;
  const at = p => { let list = roots, n = null; for (const i of p) { n = list[i]; list = n.children; } return n; };
  if (op.op === "rename") at(op.path).text = op.text;
  else if (op.op === "add") (op.parent && op.parent.length ? at(op.parent).children : roots).splice(op.index, 0, { uid: uidc(), text: op.text, src: [], desc: null, children: [] });
  else if (op.op === "remove") (op.path.length === 1 ? roots : at(op.path.slice(0, -1)).children).splice(op.path[op.path.length - 1], 1);
  else if (op.op === "move") {
    const n = at(op.path);
    (op.path.length === 1 ? roots : at(op.path.slice(0, -1)).children).splice(op.path[op.path.length - 1], 1);
    (op.to_parent && op.to_parent.length ? at(op.to_parent).children : roots).splice(op.index, 0, n);
  }
}
/* 心跳 */
function beat() {
  if (!ONLINE) { const c = $("#conn"); c.textContent = "离线模式（静态页面）"; c.classList.add("off"); return null; }
  const t = setInterval(() => {
    fetch(API + "healthz").then(r => { if (!r.ok) throw 0; if (!S.online) { location.reload(); } })
      .catch(() => goOffline());
  }, 5000);
  return t;
}

/* ================= 启动 ================= */
function boot() {
  $("#proj").textContent = DATA.project["项目名称"] || "";
  S.clar = {};
  if (!ONLINE) { const c = $("#conn"); c.textContent = "离线模式（静态页面）"; c.classList.add("off"); }
  else {
    fetch(API + "healthz").then(r => r.json()).then(() => { $("#conn").textContent = "已连接 · 本地服务"; }).catch(() => goOffline());
  }
  renderOverview(); renderKpis(); renderGates(); renderClar();
  renderVolumes(); refreshNumbering();
  renderGuideTree(); renderGuidePills(); renderGuideDetail();
  renderPromises();
  tabCount(); refreshSaveStates();
  const h = new URLSearchParams(location.hash.slice(1)).get("tab");
  if (h && ["overview", "tree", "guide", "promise"].includes(h)) switchTab(h);
  if (DATA.draft) draftRestore();
  beat();
  document.addEventListener("keydown", e => {
    if (e.key === "s" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); saveAll(); }
  });
}
boot();
</script>
